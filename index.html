<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131f">
  <meta name="description" content="SAST-BOOK is temporarily closed. We'll be back very soon.">
  <meta property="og:title" content="SAST-BOOK — Back Very Soon">
  <meta property="og:description" content="SAST-BOOK is temporarily closed while we prepare to reopen.">
  <title>SAST-BOOK — Back Very Soon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #07131f;
      color: #f4f6f7;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(37, 92, 116, 0.28), transparent 58%),
        linear-gradient(145deg, #07131f 0%, #0b1e2b 52%, #08131e 100%);
    }

    main {
      width: min(100%, 720px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(58vw, 220px);
      max-height: 190px;
      object-fit: contain;
      margin: 0 0 34px;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.34));
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 19px;
      color: #c7a96b;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c7a96b;
      content: "";
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(2.35rem, 7vw, 4.75rem);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.055em;
    }

    h1 span {
      display: block;
      color: #c7a96b;
    }

    p {
      max-width: 470px;
      margin: 24px 0 0;
      color: #b6c2ca;
      font-size: clamp(1rem, 2.3vw, 1.16rem);
      line-height: 1.75;
    }

    @media (max-width: 480px) {
      .logo { margin-bottom: 28px; }
      p { margin-top: 19px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="closure-title">
    <img class="logo" src="assets/logo-transparent.png" alt="San Andreas State Troopers logo">
    <div class="status">Temporarily closed</div>
    <h1 id="closure-title">We'll be back <span>very soon.</span></h1>
    <p>SAST-BOOK is currently closed while we prepare to reopen.</p>
  </main>
</body>
</html>
